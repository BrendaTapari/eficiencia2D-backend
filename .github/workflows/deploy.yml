name: Deploy a GCP

# Despliegue continuo: cada push a main entra por SSH a la VM de GCP, trae el
# código nuevo y reinicia el servicio.
on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions (útil para redeploys).
  workflow_dispatch:

# Evita que dos despliegues se pisen: si llega un push mientras corre otro, el
# nuevo espera en vez de dejar el servidor a medio actualizar.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: Actualizar VM por SSH
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 15m
          # El corte ante un fallo lo da el `set -e` del script (script_stops no
          # existe en esta versión de la action y sólo genera un warning).
          script: |
            set -e
            cd /opt/eficiencia2D-backend
            # reset --hard en vez de pull: deja la VM IDÉNTICA a main. Un `git pull`
            # aborta si algún archivo versionado quedó modificado en el servidor
            # ("local changes would be overwritten by merge") y frena el despliegue.
            # El servidor es una copia desechable del repo: no se editan archivos ahí.
            # No borra lo ignorado por git (venv/, .env, temp/): esos quedan intactos.
            git fetch origin main
            git reset --hard origin/main
            # Se invoca con `bash` en vez de `./`: así no hace falta el bit de
            # ejecución (git versiona los permisos y un chmod ensuciaría el repo).
            bash restart_server.sh
