# Reverse proxy nginx para Eficiencia2D (opción RECOMENDADA para producción).
# Con esto, uvicorn escucha en 127.0.0.1:8081 (sin privilegios) y nginx expone 80/443
# hacia internet, maneja TLS (Let's Encrypt) y el body grande de los uploads.
#
# Instalar:  sudo cp deploy/nginx-eficiencia2d.conf /etc/nginx/sites-available/eficiencia2d
#            sudo ln -s /etc/nginx/sites-available/eficiencia2d /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# TLS:       sudo certbot --nginx -d eficiencia2d.com.ar -d www.eficiencia2d.com.ar

server {
    listen 80;
    server_name eficiencia2d.com.ar www.eficiencia2d.com.ar;

    # Los modelos 3D pueden pesar cientos de MB (MAX_FILE_SIZE_BYTES = 500 MB).
    client_max_body_size 550M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El pipeline de geometría puede tardar en modelos grandes; subir timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
